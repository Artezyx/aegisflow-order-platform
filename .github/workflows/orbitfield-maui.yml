name: OrbitField MAUI portable verification
on:
  push:
    paths:
      - 'labs/orbitfield-maui/**'
      - '.github/workflows/orbitfield-maui.yml'
  pull_request:
    paths:
      - 'labs/orbitfield-maui/**'
      - '.github/workflows/orbitfield-maui.yml'
jobs:
  domain-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test labs/orbitfield-maui/tests/OrbitField.Tests.csproj --configuration Release
      - run: dotnet build labs/orbitfield-maui/server/OrbitField.SyncApi.csproj --configuration Release
