name: Meridian Insights validation
on:
  push:
    paths: ['labs/meridian-insights/**', '.github/workflows/meridian-insights.yml']
  pull_request:
    paths: ['labs/meridian-insights/**', '.github/workflows/meridian-insights.yml']
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - run: dotnet test labs/meridian-insights/tests/Meridian.Tests.csproj --configuration Release
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: labs/meridian-insights/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run build
