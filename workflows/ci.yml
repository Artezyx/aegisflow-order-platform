name: AegisFlow CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AegisFlow.slnx
      - run: dotnet build AegisFlow.slnx --no-restore --configuration Release
      - run: dotnet test AegisFlow.slnx --no-build --configuration Release --verbosity normal
